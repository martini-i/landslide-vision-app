services:
  groundtruth:
    build:
      context: .
      dockerfile: Dockerfile
    image: groundtruth:latest
    container_name: groundtruth
    restart: unless-stopped
    ports:
      # host_port:container_port — change 8000 on the left to whatever host
      # port you want GroundTruth reachable on from your network.
      - "8000:8000"
